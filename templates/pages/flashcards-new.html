{% extends "base.html" %}

{% block content %}

<div class="container">
  <div class="column">
    <div class="card">
      <div class="card-header">
        <div><h3 class="card-label">Flashcards</h3></div>
      </div> <!-- Card Header -->

      <div class="card-body"
           id="flashcard-game"
           hx-get="/partials/flashcards-content-new"
           hx-trigger="load"
           hx-target="this"
           hx-swap="innerHTML">
        <!-- Populated on load: resumes an active game if one exists (from cookie),
             otherwise renders a fresh game. See partials/flashcards-content.html -->
      </div> <!-- Card Body -->
    </div> <!-- Card -->
  </div> <!-- Column -->
</div> <!-- Container -->


{% endblock %}
