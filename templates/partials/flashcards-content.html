<section class="flashcard-game">
  
  <header class="page-head">
    <p class="eyebrow">Choose your operation</p>
    <nav class="op-menu" aria-label="Operation select">
      <button class="op-btn is-active" type="button" aria-label="Addition">+</button>
      <button class="op-btn" type="button" aria-label="Subtraction">&minus;</button>
      <button class="op-btn" type="button" aria-label="Multiplication">&times;</button>
      <button class="op-btn" type="button" aria-label="Division">&divide;</button>
      <button class="op-btn" type="button" aria-label="Random">All</button>
    </nav>
  </header>

  <section class="flashcard" aria-label="Flashcard problem">
    <div class="pin" aria-hidden="true"></div>

    <div class="problem">
      <div class="operand">X</div>
      <div class="operand-row">
        <span class="operator" aria-hidden="true">+</span>
        <span class="operand">Y</span>
      </div>
      <div class="rule"></div>

      <form class="answer-row">
        <label class="sr-only" for="answer">Your answer</label>
       <input
        id="answer"
        class="answer-input"
        type="number"
        inputmode="numeric"
        placeholder="?"
        autocomplete="off"
      >
      </form>
    </div> <!-- .problem -->
  </section> <!-- .flashcard -->
  <div>
    <button class="op-buttons" type="button" aria-label="New Game">New Game</button>
  </div>
  <div class="scoreboard">
    <p class="score">Score: <span id="score">0</span></p>
    <p class="streak">Streak: <span id="streak">0</span></p>
  </div> <!-- .scoreboard -->
</section> <!-- .flashcard-game -->
<p class="hint">Type your answer and press Enter</p>
